name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          SDK=$ANDROID_HOME
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          export PATH="$PATH:$SDK/cmdline-tools/latest/bin:$SDK/platform-tools"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Setup Gradle
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TOTPValidator-debug.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TOTPValidator-debug.apk

      - name: Dump build log on failure
        if: failure()
        run: |
          echo "========== BUILD.LOG (last 400 lines) =========="
          tail -n 400 build.log || cat build.log || true

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            app/build/reports/
            app/build/outputs/logs/

      - name: Create issue with build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG="$(tail -c 5000 build.log | sed 's/\r//g')"
          # Escape for JSON
          BODY=$(printf '%s' "$LOG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
          gh issue create \
            --title "Build failed on run ${GITHUB_RUN_NUMBER}" \
            --body "## Build log (tail)\n\n\`\`\`\n${BODY}\n\`\`\`" \
            --label "build"

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TOTPValidator-debug-apk
          path: TOTPValidator-debug.apk

      - name: Publish GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.1.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" TOTPValidator-debug.apk \
            --title "TOTPValidator $TAG" \
            --notes "安卓 TOTP 验证器 debug APK（含相机扫码，兼容微软/谷歌验证器）"
